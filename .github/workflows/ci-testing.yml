name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm ci --build=missing

      - run: npm run -w express-backend lint

      - run: npm run -w react-frontend lint

      - run: npm run -w react-frontend build

      - name: Run Cypress with coverage
        run: |
          npm run -w react-frontend dev &
          npx wait-on http://localhost:5173
          npm run -w react-frontend test:e2e

      - name: Check coverage file
        run: |
          ls -la packages/react-frontend/coverage
          test -f packages/react-frontend/coverage/lcov.info

